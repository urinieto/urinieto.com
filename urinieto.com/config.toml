#baseURL = "https://urinieto.netlify.app"
baseURL = "https://www.urinieto.com/"
#url = "https://urinieto.netlify.app"
#url = "https://urinieto.com"
languageCode = "en-us"
theme = "anatole"
summarylength = 10
enableEmoji = true
enableRobotsTXT = true

DefaultContentLanguage = "en"
sectionPagesMenu = "main"
Paginate = 8 # Number of posts per page on /blog/
googleAnalytics = ""

[params]
title = "Oriol (Uri) Nieto"
author = "Oriol Nieto"
description = "Audio Researcher. Musician. Titan."
profilePicture = "wp-content/uploads/2023/uri-side.jpg"
keywords = ""
favicon = "favicons/"
customCss = ["css/uri.css", "css/publications.css", "css/news.css"]
newsOnHome = 6 # Number of news items on the home page (full list at /news/)
customJs = []
mainSections = ["post"]
images = ["images/site-feature-image.png"]
# Link previews (WhatsApp, iMessage, Slack...): image and description used for the home page
# (and as a fallback for pages without their own thumbnail/description)
shareImage = "images/share-melspec-face.jpg"  # 1200x630 link-preview image
shareDescription = "Researcher building human-centered AI for audio-visual creators."

## Math settings
[params.math]
enable = true  # options: true, false. Enable math support globally, default: false. You can always enable math on per page.
use = "katex"  # options: "katex", "mathjax". default is "katex".

