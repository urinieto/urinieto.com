# News data file for urinieto.com
#
# Each item is one line of news. Items are sorted by date automatically
# (newest first), so you can add new ones anywhere — top is easiest.
#
# Fields:
#   date:  "YYYY-MM-DD" (required, keep the quotes). Shown as "Nov 2026".
#   text:  The news itself, in Markdown (required). Links work as usual:
#            [link text](https://example.com)
#          To point at a paper, link to its anchor on the publications page:
#            [TAC](/publications/#pub-kumar2026tac)
#   emoji: Optional emoji shown before the date (e.g. "🎉", "🎤", "🎸").
#
# The homepage shows the latest `newsOnHome` items (set in config.toml);
# the full list lives at /news/.

